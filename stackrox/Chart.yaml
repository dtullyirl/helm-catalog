apiVersion: v2
name: stackrox
description: >
  Platform wrapper for RHACS (Red Hat Advanced Cluster Security) Central Services.
  Deployed on the hub cluster only — guarded by clusterType=hub in the platform-apps template.
  Deploys the ACS Central instance; ACS operator must already be installed via operator-installer.
type: application
version: 0.1.0
dependencies:
  - name: central-services
    version: "400.6.0"
    repository: https://charts.stackrox.io
