org: acme

clusterType: dev
clusterGroup: payments
clusterName: ""
region: eu-west-1
owner: platform

platformAppsRepoURL: https://github.com/dtullyirl/platform-apps.git
platformConfigRepoURL: https://github.com/dtullyirl/platform-config.git

platform:
  version: main
  argocd:
    syncPolicy:
      automated:
        selfHeal: true   # drift from git is corrected automatically
        prune: true      # child Application CRs removed from platform-apps are cleaned up
      syncOptions:
        - Validate=true
        - CreateNamespace=false
        - RespectIgnoreDifferences=true
        - ServerSideApply=true

# Install OpenShift GitOps operator on the spoke before creating the root Application
installOpenShiftGitOps: true

# ── OpenShift GitOps operator ─────────────────────────────────────────────────
# Installed via a direct OLM Subscription rather than the operator-installer pattern.
# Reason: operator-installer creates Argo CD Application CRs, which requires Argo CD
# to already be running — a chicken-and-egg problem at bootstrap time.
# Pin channel + csv here for auditability; bump csv to upgrade the operator version.
gitopsOperator:
  channel: latest
  csv: openshift-gitops-operator.v1.20.4
  installPlanApproval: Automatic
