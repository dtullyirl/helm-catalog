org: acme

clusterType: dev
clusterGroup: payments
clusterName: ""
region: eu-west-1
owner: platform

platformAppsRepoURL: https://github.com/nu-j/platform-apps.git
platformConfigRepoURL: https://github.com/nu-j/platform-config.git

platform:
  version: main
  argocd:
    syncPolicy:
      automated:
        selfHeal: true   # drift from git is corrected automatically
        prune: true      # child Application CRs removed from platform-apps are cleaned up
      syncOptions:
        - Validate=true
        - CreateNamespace=false
        - RespectIgnoreDifferences=true
        - ServerSideApply=true

# Install OpenShift GitOps operator on the spoke before creating the root Application
installOpenShiftGitOps: true
