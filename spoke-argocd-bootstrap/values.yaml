org: acme

clusterType: dev
clusterGroup: eng
clusterName: ""
region: eu-west-1
owner: platform

platformAppsRepoURL: https://github.com/nu-j/platform-apps.git
platformConfigRepoURL: https://github.com/nu-j/platform-config.git

platform:
  version: main
  argocd:
    syncPolicy:
      syncOptions:
        - Validate=true
        - CreateNamespace=false
        - RespectIgnoreDifferences=true
        - ServerSideApply=true

# Install OpenShift GitOps operator on the spoke before creating the root Application
installOpenShiftGitOps: true
