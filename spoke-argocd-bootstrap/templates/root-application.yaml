{{- $clusterType := .Values.clusterType }}
{{- $clusterGroup := .Values.clusterGroup }}
{{- $region := .Values.region }}
{{- $platformSyncPolicy := (default ((.Values.platform).argocd).syncPolicy false) }}
{{- $platformVersion := (required "platform.version is required" (.Values.platform).version) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Name encodes group and type so it's clear which cluster this roots at a glance.
  # e.g. "eng-hub-aoa", "payments-dev-aoa", "digital-preprod-aoa"
  name: {{ .Values.clusterGroup }}-{{ .Values.clusterType }}-aoa
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    # Root Application lives in openshift-gitops — the cluster-wide Argo CD instance
    # created by the operator above. platform-apps only emits Application CRs into
    # openshift-gitops, so there is no value in a separate platform-tools destination.
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: {{ .Values.platformAppsRepoURL }}
      path: .
      targetRevision: {{ $platformVersion }}
      helm:
        valueFiles:
          - $platform_values/default.yaml
          - $platform_values/regions/{{ $region }}/region.yaml
          - $platform_values/clusters/{{ $clusterType }}/common.yaml
          - $platform_values/clusters/{{ $clusterType }}/{{ $clusterGroup }}/clusterdef.yaml
        ignoreMissingValueFiles: true
    - ref: platform_values
      repoURL: {{ .Values.platformConfigRepoURL }}
      targetRevision: {{ $platformVersion }}
{{- if $platformSyncPolicy }}
  syncPolicy: {{ $platformSyncPolicy | toYaml | nindent 4 }}
{{- else }}
  syncPolicy: {}
{{- end }}
