{{- /*
  checluster.yaml — CheCluster CR
  Creates a single DevSpaces instance on this cluster.
  Values flow from platform-config via the Argo CD multi-source valueFiles chain.
  The DevSpaces operator (installed by operator-installer) must be ready before this is applied.
  Argo CD sync-wave "1" ensures the operator installs first (operator-installer is wave "0").
*/ -}}
---
# Pre-create the namespace so the CheCluster CR and RBAC resources have a home.
# The DevSpaces operator also manages this namespace; pre-creating it is safe and
# prevents the "namespace not found" error when Argo CD syncs for the first time.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.devspaces.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # Marks this namespace as managed by our GitOps platform
    platform/managed-by: devspaces
---
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: {{ .Values.devspaces.instanceName }}
  namespace: {{ .Values.devspaces.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # ServerSideApply=true: delegate patch creation to the API server, which knows the
    # actual installed CRD schema. This avoids Argo CD's "typed patch object" errors that
    # occur when its bundled OpenAPI schema differs from the operator's installed CRD.
    # Validate=false: skip Argo CD client-side validation for the same reason.
    argocd.argoproj.io/sync-options: Validate=false,ServerSideApply=true
spec:
  devEnvironments:
    # ── Concurrency ───────────────────────────────────────────────────────────
    maxNumberOfWorkspacesPerUser: {{ .Values.devspaces.devEnvironments.maxNumberOfWorkspacesPerUser }}
    maxNumberOfRunningWorkspacesPerUser: {{ .Values.devspaces.devEnvironments.maxNumberOfRunningWorkspacesPerUser }}

    # ── Idle / timeout ────────────────────────────────────────────────────────
    secondsOfInactivityBeforeIdling: {{ .Values.devspaces.devEnvironments.secondsOfInactivityBeforeIdling }}
    secondsOfRunBeforeIdling: {{ .Values.devspaces.devEnvironments.secondsOfRunBeforeIdling }}

    # ── Namespace isolation ───────────────────────────────────────────────────
    # CheCluster v2: defaultNamespace replaces the v1 namespaceTemplate field.
    defaultNamespace:
      template: {{ .Values.devspaces.devEnvironments.defaultNamespace.template | quote }}
      autoProvision: {{ .Values.devspaces.devEnvironments.defaultNamespace.autoProvision }}

    # ── Storage ───────────────────────────────────────────────────────────────
    storage:
      pvcStrategy: {{ .Values.devspaces.devEnvironments.storage.pvcStrategy }}

    # ── Editor / startup ──────────────────────────────────────────────────────
    defaultEditor: {{ .Values.devspaces.devEnvironments.defaultEditor | quote }}
    startTimeoutSeconds: {{ .Values.devspaces.devEnvironments.startTimeoutSeconds }}

  components:
    cheServer:
      logLevel: {{ .Values.devspaces.components.cheServer.logLevel }}
    metrics:
      enable: {{ .Values.devspaces.components.metrics.enable }}
