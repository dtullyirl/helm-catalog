#
# values.yaml — DevSpaces CheCluster defaults
#
# These values are applied to every cluster where devspacesConfig.enabled=true.
# Override any key in platform-config at the region, environment, or cluster level.
#

devspaces:
  # Namespace where the CheCluster CR is created.
  # Must match the operator's target namespace (openshift-devspaces by default).
  namespace: openshift-devspaces

  # Name of the CheCluster CR — one per cluster.
  instanceName: devspaces

  devEnvironments:
    # ── Concurrency limits ────────────────────────────────────────────────────
    # Max workspaces a single user can create (running + stopped combined).
    maxNumberOfWorkspacesPerUser: 2
    # Max workspaces a single user can have running simultaneously.
    maxNumberOfRunningWorkspacesPerUser: 2

    # ── Idle / timeout guardrails ──────────────────────────────────────────────
    # Stop a workspace after 30 minutes of no activity — largest resource-saving lever.
    secondsOfInactivityBeforeIdling: 1800
    # Hard upper bound on total workspace run time (8 hours); set to 0 for unlimited.
    secondsOfRunBeforeIdling: 28800

    # ── Namespace isolation ────────────────────────────────────────────────────
    # Each user's workspace runs in its own namespace: <username>-devspaces
    # Predictable, auditable, and easy to apply resource quotas against.
    # CheCluster v2 field: spec.devEnvironments.defaultNamespace.template
    defaultNamespace:
      template: "<username>-devspaces"
      # autoProvision: true means DevSpaces creates the namespace automatically.
      # Set false only if you pre-create user namespaces via another mechanism.
      autoProvision: true

    # ── Storage ───────────────────────────────────────────────────────────────
    # The DevSpaces operator defaults to 10Gi per-user PVC with the per-user strategy,
    # which is exactly what we want for a demo. No override needed.
    # To increase the size on a specific cluster add to clusterdef.yaml:
    #   devspaces:
    #     devEnvironments:
    #       storage:
    #         pvcSize: 20Gi   # check your installed CRD version supports this field
    storage:
      # per-user: one PVC shared across all workspaces for a user (10Gi by operator default).
      # per-workspace: isolated PVC per workspace — uses more storage but fully isolated.
      pvcStrategy: per-user

    # Default editor — VS Code in-browser via the che-code extension.
    defaultEditor: che-incubator/che-code/latest

    # Workspace startup timeout: fail fast rather than leaving pods pending.
    startTimeoutSeconds: 300

  components:
    cheServer:
      # INFO is sufficient for day-to-day operations; use DEBUG only when troubleshooting.
      logLevel: INFO
    metrics:
      # Expose /metrics endpoint for Prometheus scraping.
      enable: true
